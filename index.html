    }
    else if(act==='open')openDetail('contests',item.id);
    else if(act==='notes')openDetail('contests',item.id,true);
    else if(act==='del')deleteItem('contests',item.id);
  });

  v.querySelectorAll('.rq-row').forEach(r=>r.onclick=()=>openDetail('contests',r.dataset.id));

  const cSolvedBtn=$('#cSolvedBtn',v),cSolvedIc=$('#cSolvedIc',v),cName=$('#cName',v);
  let cSolved=false;
  cSolvedBtn.onclick=()=>{cSolved=!cSolved;cSolvedBtn.classList.toggle('on',cSolved);cSolvedIc.classList.toggle('on',cSolved)};
  cName.addEventListener('input',()=>cName.classList.remove('err'));
  $('#cForm',v).addEventListener('submit',e=>{
    e.preventDefault();
    const name=cName.value.trim();
    if(!name){cName.classList.add('err','shake');setTimeout(()=>cName.classList.remove('shake'),450);cName.focus();return}
    const date=$('#cDate',v).value||todayKey();
    DB.contests.push({id:uid(),name,date,minutes:Math.max(0,+$('#cMin',v).value||0),
      solved:cSolved,notes:'',description:'',code:'',language:'python',hintStage:0,
      order:nextOrder('contests',date)});
    save();cName.value='';$('#cMin',v).value='';cSolved=false;cSolvedBtn.classList.remove('on');cSolvedIc.classList.remove('on');cName.focus();
    toast(`Added \u201C${esc(name)}\u201D to the contest log`);renderApp();
  });

}

================================================================ */
function buildInsights(){
  const s=computeStats(),out=[],tk=todayKey(),run=streakRun();
  const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const plur=n=>n===1?'':'s';
  const openCh=DB.streaks.filter(q=>q.date===tk&&!q.solved).length;
  if(openCh)out.push({icon:'zap',title:'Daily challenge open',text:`${openCh} streak question${openCh>1?'s':''} logged today but still unsolved — finishing it extends the ${run.cur}-day challenge run. It is the cheapest streak win on the board.`});
  if(s.todaySolved)out.push({icon:'flame',title:`Any-solve streak alive — ${s.cur} day${plur(s.cur)}`,
    text:`You already solved something today. Longest on record: ${s.longest} day${plur(s.longest)}${s.longest>s.cur?` — ${s.longest-s.cur} more to beat it.`:` — that is your record.`}`});
  else if(s.cur>0)out.push({icon:'flame',title:`${s.cur}-day streak at risk`,text:'Nothing solved today yet. One problem — even an Easy — keeps the chain going.'});
  else out.push({icon:'flame',title:'No active streak',text:'Solve one problem today and your streak starts at 1.'});
  out.push({icon:'trending-up',title:'Consistency',text:`Active on ${s.activeDays} of the last ${s.span} days (${Math.round(s.consistency*100)}%). ${s.consistency>=.6?'That cadence compounds — protect it.':'Aim for one solved problem per day to build momentum.'}`});
  const d=s.diffs,tot=d.Easy+d.Medium+d.Hard;
  if(tot)out.push({icon:'target',title:'Difficulty mix',text:`${d.Easy} Easy · ${d.Medium} Medium · ${d.Hard} Hard solved.${d.Hard===0?' No Hards yet — schedule one this week with a 30-minute timer.':''}${d.Easy>tot*.6?' Leaning easy — nudge the average up with more Mediums.':''}`});
  if(s.reviews.length)out.push({icon:'refresh-cw',title:'Review due',
    text:s.reviews.slice(0,3).map(r=>`${r.num?`Q${r.num} `:''}${r.name} (${dayDiff(r.date,tk)}d old)`).join(' · ')+' — re-solve them without your notes.'});
  if(s.activeDays>=4){const bi=s.wd.indexOf(Math.max(...s.wd));
    out.push({icon:'calendar',title:'Rhythm',text:`${WD[bi]}s are your strongest day (${s.wd[bi]} active). Schedule the harder problems there.`})}
  if(s.contest.total>=3)out.push({icon:'trophy',title:'Contest pace',
    text:`${s.contest.solved}/${s.contest.total} solved under contest conditions — avg ${fmtMin(s.contest.avg)} per solve, fastest ${fmtMin(s.contest.fastest)}.`});
  return out;
}

function coachReply(q){
  const s=computeStats(),run=streakRun(),t=q.toLowerCase(),tk=todayKey();
  const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const plur=n=>n===1?'':'s';
  if(/\b(hi|hello|hey|yo)\b/.test(t))return `Hey. Quick pulse: ${s.totalSolved} solved, ${run.cur}-day challenge run, ${s.cur}-day any-solve streak${s.todaySolved?'':' (at risk today)'}. Ask me about reviews, weak spots, contests, or a weekly plan.`;
  if(/streak|challenge|daily challenge/.test(t)){
    const open=DB.streaks.filter(q=>q.date===tk&&!q.solved).length;
    const note=s.todaySolved
      ?(open?'\nToday is covered for the any-solve streak, but the daily challenge is still open.':'\nToday is fully banked.')
      :'\nToday is not banked yet — the daily challenge fixes both streaks in one move.';
    return `Two streaks to watch:\n• Challenge streak: ${run.cur} day${plur(run.cur)} — consecutive days with a solved streak question (best run: ${run.longest}).\n• Any-solve streak: ${s.cur} day${plur(s.cur)} — any solved problem, from any section, keeps it alive (best: ${s.longest}).${note}`;
  }
  if(/review|revis|revisit|forget|spaced/.test(t)){
    if(!s.reviews.length)return 'Nothing is due yet — I flag solved problems once they are about a week old, so the pattern stays fresh.';
    return `Due for spaced review (solve, then revisit after about a week):\n${s.reviews.map(r=>`• ${r.num?`Q${r.num} `:''}${r.name} — ${dayDiff(r.date,tk)} days old, ${r.difficulty}`).join('\n')}\nAttempt each from scratch before opening your notes.`;
  }
  if(/weak|struggl|stuck|improve|better|bad/.test(t)){
    const weak=Object.entries(s.weak).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${k} (${n} open)`).join(', ');
    const top=Object.entries(s.topics).sort((a,b)=>b[1]-a[1])[0];
    return `Strongest area: ${top?`${top[0]} with ${top[1]} solved`:'not enough data yet'}.\nOpen problems by topic: ${weak||'none — clean slate'}.\n${s.diffs.Hard===0?'You have zero solved Hards — pick one, timebox 30 minutes, then read the editorial. That gap is where rating hides.':'Good Hard coverage — keep mixing them in weekly.'}`;
  }
  if(/contest/.test(t)){
    if(!s.contest.total)return 'No contest problems logged yet. Add them (with time spent) in the Contests view — the time data is what makes the analysis useful.';
    return `Contests: ${s.contest.solved} of ${s.contest.total} solved.\nAverage solve: ${fmtMin(s.contest.avg)} · fastest: ${fmtMin(s.contest.fastest)}.\nStrategy: bank the two easiest problems in the first 20 minutes, then commit to one hard problem — switching costs more than sticking.`;
  }
  if(/plan|schedule|week|should i (do|solve)|next/.test(t)){
    const pending=DB.problems.filter(p=>p.date===tk&&!p.solved);
    const open=DB.streaks.filter(q=>q.date===tk&&!q.solved).length;
    const bi=s.activeDays>=4?s.wd.indexOf(Math.max(...s.wd)):null;
    return `Here is your next 7 days:\n• Today — ${open?'finish today\u2019s daily challenge first — it is the anchor habit':(pending.length?`close out ${pending.length} open problem${plur(pending.length)} to protect the ${s.cur}-day streak`:'already solved; optionally queue one more Medium')}.\n• Mid-week — ${s.reviews.length?`re-solve ${s.reviews[0].name} from scratch`:'one new Medium in your weakest topic'}.${bi!==null?`\n• ${WD[bi]} — your strongest day; attempt a Hard there.`:''}\n• Contest day — do a full timed contest and log every problem with its minutes.`;
  }
  if(/today/.test(t)){
    const items=[...DB.problems,...DB.streaks,...DB.contests].filter(i=>i.date===tk);
    if(!items.length)return 'Nothing logged today. Add today\u2019s problem in Daily Problems or the daily challenge in Daily Streak — even an unsolved attempt counts as data.';
    const sol=items.filter(i=>i.solved).map(i=>i.name),open=items.filter(i=>!i.solved).map(i=>i.name);
    return `Today: ${sol.length}/${items.length} solved.${sol.length?`\nSolved: ${sol.join(', ')}`:''}${open.length?`\nStill open: ${open.join(', ')}`:''}${!sol.length?`\nThe ${s.cur}-day streak breaks if today ends unsolved.`:''}`;
  }
  if(/topic|pattern|tag|breakdown|categor/.test(t)){
    const es=Object.entries(s.topics).sort((a,b)=>b[1]-a[1]);
    if(!es.length)return 'No solved problems with topics yet — tag them when you add, and I can break them down.';
    return `Solved by topic:\n${es.slice(0,6).map(([k,n])=>`• ${k} — ${n}`).join('\n')}\nYour spread looks ${es.length>=5?'well balanced — good for pattern transfer.':'narrow; add variety so patterns start connecting.'}`;
  }
  if(/how|progress|report|doing|summar|overall|status|stats/.test(t)){
    return `Progress report — ${s.span} days tracked:\n• Streak: ${s.cur} current, ${s.longest} best (any solve)\n• Challenge run: ${run.cur} days, best ${run.longest}\n• Solved: ${s.totalSolved} problems on ${s.activeDays} active days (${Math.round(s.consistency*100)}% consistency)\n• Difficulty: ${s.diffs.Easy}E / ${s.diffs.Medium}M / ${s.diffs.Hard}H\n• Contests: ${s.contest.solved}/${s.contest.total} solved${s.contest.avg?`, ${fmtMin(s.contest.avg)} average`:''}\n${s.todaySolved?'• Today: done — streak safe.':'• Today: not solved yet — streak at risk.'}`;
  }
  return 'I can analyze: your streaks, spaced-repetition reviews, weak topics, contest pace, weekly planning, or a full progress report. Try \u201Cwhat should I review?\u201D';
}

function renderCoach(v){
  const s=computeStats();
  v.innerHTML=`
    ${headHTML('On-device intelligence','AI Coach','<div class="chip ghost">runs locally · no API keys · no cloud</div>')}

  }

      <div class="bubble ins"><div class="ihead"><i data-lucide="${icon}"></i><b>${title}</b></div><div class="itext">${text}</div></div>`;
    msgs.appendChild(w);refreshIcons();scrollC();
  }
  async function coachSay(text){const{el}=addBubble('coach');await typeIn(el,text,scrollC)}

    msgs.appendChild(ty);refreshIcons();scrollC();
    setTimeout(async()=>{ty.remove();const{el}=addBubble('coach');await typeIn(el,coachReply(q),scrollC)},650);
  }

  $('#chatSend',v).onclick=()=>send(input.value);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')send(input.value)});

  const QUICK=['How is my streak?','What should I review?','Where am I weak?','Contest performance','Plan my week','Full report'];
  $('#chips',v).innerHTML=QUICK.map(q=>`<button class="qchip">${q}</button>`).join('');
  $('#chips',v).querySelectorAll('.qchip').forEach(b=>b.onclick=()=>send(b.textContent));

  (async()=>{
    if(!DB.problems.length&&!DB.streaks.length&&!DB.contests.length){
      await coachSay('There is nothing to analyze yet — add a few problems in Daily Problems or log a daily challenge in Daily Streak, and I will start finding patterns in your practice.');
      return;
    }
    await coachSay(`I looked at your last ${s.span} days — ${s.totalSolved} problems solved across ${s.activeDays} active days. Here is what stands out:`);
    for(const ins of buildInsights().slice(0,4)){await sleep(280);addInsight(ins)}
    await sleep(340);
    await coachSay('Ask me anything about your progress — or start with a suggestion below.');
  })();
  refreshIcons();

  const dTa=$('#dTa',root),cTa=$('#cTa',root),nTa=$('#nTa',root),gut=$('#gut',root),mdPrev=$('#mdPrev',root);
  const hintArea=$('#hintArea',root),hintText=$('#hintText',root),hintNo=$('#hintNo',root),hintNext=$('#hintNext',root);
  const mdl=$('#mdl',root),ovl=$('#ovl',root),mLeft=$('#mLeft',root),mBody=$('#mBody',root),mSplit=$('#mSplit',root);

  dTa.value=item.description||scaffoldDesc(item,kind);
  cTa.value=item.code||STARTERS[item.language||'python'];
  nTa.value=item.notes||'';
  $('#langSel',root).value=item.language||'python';
  if(openNotes)mdl.classList.add('notes-open');
  refreshIcons();

  /* ---- image intake: button, paste, drag & drop ---- */
  async function handleImageFiles(files){
    const imgs=files.filter(f=>f&&/^image\//.test(f.type));
    if(!imgs.length)return;
    let added=0;
    for(const f of imgs){
      const du=await processImageFile(f);
      if(!du)continue;
      const imgId=addImage(du);
      const cap=(f.name||'image').replace(/\.[^.]+$/,'').slice(0,60);
      insertAtCursor(dTa,`\n\n![${cap}](img:${imgId})\n\n`);
      added++;
    }
    if(added){
      save();dirty=true;flashSave($('#dSave',root));
      toast(`${added} image${added>1?'s':''} added — flip to Preview to see ${added>1?'them':'it'}`,{icon:'image'});
      /* refresh preview if it is open */
      if(!mdPrev.hidden)mdPrev.innerHTML=mdToHtml(dTa.value);
    }
  }
  const imgFileInput=$('#imgFile',root);
  $('#imgBtn',root).onclick=()=>imgFileInput.click();
  imgFileInput.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await handleImageFiles(fs)};
  dTa.addEventListener('paste',async e=>{
    const items=[...(e.clipboardData?.items||[])];
    const files=items.filter(i=>i.kind==='file'&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);
    if(files.length){e.preventDefault();await handleImageFiles(files)}
  });
  dTa.addEventListener('dragover',e=>e.preventDefault());
  dTa.addEventListener('drop',async e=>{
    const files=[...(e.dataTransfer?.files||[])];
    if(files.some(f=>/^image\//.test(f.type))){e.preventDefault();await handleImageFiles(files)}
  });
  /* click an image in preview → lightbox */
  mdPrev.addEventListener('click',e=>{const im=e.target.closest?.('img.md-img');if(im)openLightbox(im.src)});

  const paintGut=()=>{gut.innerHTML=Array.from({length:cTa.value.split('\n').length},(_,i)=>i+1).join('<br>')};
  paintGut();
  cTa.addEventListener('scroll',()=>gut.scrollTop=cTa.scrollTop);

  const mkSave=(ind,fn)=>debounce(()=>{fn();save();dirty=true;flashSave(ind)},450);
  const saveDesc=mkSave($('#dSave',root),()=>{
    const prev=item.description||'';
    item.description=dTa.value;
    gcImages(prev,item.description);
  });
  const saveCode=mkSave($('#cSave',root),()=>item.code=cTa.value);
  const saveNotes=mkSave($('#nSave',root),()=>item.notes=nTa.value);
  dTa.addEventListener('input',saveDesc);
  nTa.addEventListener('input',saveNotes);
  cTa.addEventListener('input',()=>{paintGut();saveCode()});

  cTa.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();cTa.setRangeText('  ',cTa.selectionStart,cTa.selectionEnd,'end');paintGut();saveCode()}
    else if(e.key==='Enter'){
      e.preventDefault();
      const s=cTa.selectionStart,line=cTa.value.slice(0,s).split('\n').pop();
      const ind=(line.match(/^\s*/)||[''])[0]+(/[:{[(]\s*$/.test(line)?'  ':'');
      cTa.setRangeText('\n'+ind,s,cTa.selectionEnd,'end');paintGut();saveCode();
    }
  });

  $('#dSeg',root).querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('#dSeg',root).querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
    if(b.dataset.m==='prev'){mdPrev.innerHTML=mdToHtml(dTa.value);mdPrev.hidden=false;dTa.hidden=true}
    else{mdPrev.hidden=true;dTa.hidden=false}
  });

  $('#langSel',root).onchange=e=>{
    const nl=e.target.value,ol=item.language||'python';
    if(!item.code||cTa.value===STARTERS[ol]){cTa.value=STARTERS[nl];paintGut()}
    item.language=nl;save();dirty=true;
  };

  $('#copyBtn',root).onclick=()=>copyText(cTa.value);

  const stBtn=$('#mStatus',root);
  stBtn.onclick=()=>{
    const before=solvedSet().has(todayKey());
    const wasSolved=item.solved;
    item.solved=!item.solved;dirty=true;save();
    stBtn.className='chip status '+(item.solved?'st-ok':'st-no');
    stBtn.textContent=item.solved?'Solved':'Unsolved';
    if(!(kind==='streaks'&&maybeCelebrateStreak(item,wasSolved)))maybeStreakToast(before);
  };

  const hints=hintsFor(item);let stage=item.hintStage||0;
  function revealHint(){
    hintArea.hidden=false;
    if(stage>=hints.length){
      hintNo.textContent='All hints revealed';
      hintNext.style.display='none';
      typeIn(hintText,'You have the full approach — stop reading and write the code. If it still resists after 15 more minutes, step away; the insight usually lands on the walk back.');
      return;
    }
    hintNo.textContent=`Hint ${stage+1} of ${hints.length}`;
    hintNext.style.display=stage>=hints.length-1?'none':'';
    typeIn(hintText,hints[stage]);
    item.hintStage=++stage;save();dirty=true;
  }
  $('#hintBtn',root).onclick=revealHint;
  hintNext.onclick=revealHint;

  $('#mNotesBtn',root).onclick=()=>{
    mdl.classList.toggle('notes-open');
    if(mdl.classList.contains('notes-open'))setTimeout(()=>nTa.focus(),380);
  };

  let drag=false;
  const mv=e=>{
    if(!drag)return;
    const r=mBody.getBoundingClientRect();
    const reserve=mdl.classList.contains('notes-open')?700:360;
    const w=Math.max(240,Math.min(e.clientX-r.left,r.width-reserve));
    mLeft.style.flex=`0 0 ${w}px`;
  };
  const up=()=>{drag=false;document.body.classList.remove('colcur')};
  mSplit.addEventListener('mousedown',e=>{drag=true;document.body.classList.add('colcur');e.preventDefault()});
  window.addEventListener('mousemove',mv);
  window.addEventListener('mouseup',up);

  function close(){
    const prevDesc=item.description||'';
    item.description=dTa.value;item.code=cTa.value;item.notes=nTa.value;
    gcImages(prevDesc,item.description);save();
    window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);
    ovl.classList.add('out');setTimeout(()=>{root.innerHTML=''},200);
    if(dirty)renderApp();
  }
  $('#mClose',root).onclick=close;
  ovl.addEventListener('mousedown',e=>{if(e.target===ovl)close()});
  const escH=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',escH)}};
  document.addEventListener('keydown',escH);
}

/* ================================================================
   APP RENDER
================================================================ */
function renderApp(){
  renderSidebar();
  const root=$('#view'),v=document.createElement('div');
  v.className='view';root.replaceChildren(v);
  ({daily:renderDaily,streak:renderStreak,contests:renderContests,coach:renderCoach})[state.view](v);
  refreshIcons();
}
renderApp();
</script>
</body>
</html>
